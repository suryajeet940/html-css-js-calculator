<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATE ME!-A calculator made by surya!!</title>
    
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link href="utils.css" rel="stylesheet" type="text/css" />
    <title>Document</title>
</head
<body>
    <h1 class="text-center">CALCULATOR BY SURYA!!</h1>
    <br>
    <h2 tect-align:center;> pls don't use %,$,^  </h2>
    <div class="container flex flex-col items-center  mx-auto ">
        <div class="row">
            <input class="input" type="text"/>
            

        </div>
         <div class="row">
            <button class="button" style="padding:23px">C</button>
            <button class="button" style="padding:23px">%</button>
            <button class="button" style="padding:23px">^</button>
            <button class="button" style="padding:23px">$</button>

        </div>
        <div class="row">
            <button class="button" style="padding:23px">7</button>
            <button class="button" style="padding:23px">8</button>
            <button class="button" style="padding:23px">9</button>
            <button class="button" style="padding:23px">*</button>

        </div>
        <div class="row">
            <button class="button" style="padding:23px">4</button>
            <button class="button" style="padding:23px">5</button>
            <button class="button" style="padding:23px">6</button>
            <button class="button" style="padding:23px">-</button>

        </div>
        <div class="row">
            <button class="button" style="padding:23px">3</button>
            <button class="button" style="padding:23px">2</button>
            <button class="button" style="padding:23px">1</button>
            <button class="button" style="padding:23px">+</button>

        </div>
        <div class="row">
            <button class="button" style="padding:23px">0</button>
            <button class="button" style="padding:23px">.</button>
            <button class="button" style="padding:23px">/</button>
            <button class="button" style="padding:23px">=</button>

        </div>




    </div>
    <script src="script.js"></script>
    
</body>
</html>
